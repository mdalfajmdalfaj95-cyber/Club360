<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club360 BD — Club Management Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="toast"></div>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">C<span>+</span></div>
      <div><b>Club360</b><small>Bangladesh</small></div>
    </div>
    <div class="club-mini">
      <div class="club-avatar">ABC</div>
      <div><b>ABC Club BD</b><small>Dhaka, Bangladesh</small></div>
    </div>
    <nav id="nav">
      <button class="nav-item active" data-page="dashboard">⌂ <span>Dashboard</span></button>
      <button class="nav-item" data-page="members">♙ <span>Members</span></button>
      <button class="nav-item" data-page="committee">♛ <span>Committee</span></button>
      <button class="nav-item" data-page="finance">৳ <span>Finance</span></button>
      <button class="nav-item" data-page="payments">▣ <span>Payments & Receipts</span></button>
      <button class="nav-item" data-page="events">◷ <span>Events</span></button>
      <button class="nav-item" data-page="attendance">✓ <span>Attendance</span></button>
      <button class="nav-item" data-page="blood">🩸 <span>Blood Donors</span></button>
      <button class="nav-item" data-page="emergency">⚠ <span>Emergency Help</span></button>
      <button class="nav-item" data-page="meetings">☷ <span>Meetings</span></button>
      <button class="nav-item" data-page="polls">☑ <span>Polls</span></button>
      <button class="nav-item" data-page="gallery">▧ <span>Gallery</span></button>
      <button class="nav-item" data-page="documents">▤ <span>Documents</span></button>
      <button class="nav-item" data-page="inventory">▦ <span>Inventory</span></button>
      <button class="nav-item" data-page="staff">♟ <span>Staff & Salary</span></button>
      <button class="nav-item" data-page="facilities">⌂ <span>Facility Booking</span></button>
      <button class="nav-item" data-page="reports">◫ <span>Reports</span></button>
      <button class="nav-item" data-page="activity">◉ <span>Audit Log</span></button>
      <button class="nav-item" data-page="settings">⚙ <span>Settings</span></button>
    </nav>
    <div class="sidebar-footer">
      <button id="themeBtn" class="ghost-btn">☾ Dark mode</button>
      <button id="roleBtn" class="ghost-btn">⇄ Switch role</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn mobile-only">☰</button>
      <div class="top-search"><span>⌕</span><input id="globalSearch" placeholder="Search members, events, receipts..."></div>
      <div class="top-actions">
        <button class="icon-btn" id="langBtn">বাংলা</button>
        <button class="icon-btn notification-btn" id="notificationBtn">🔔<i>4</i></button>
        <div class="user-menu">
          <div class="user-avatar">NS</div>
          <div><b>Nafiz Sarkar</b><small id="roleLabel">Super Admin</small></div>
        </div>
      </div>
    </header>
    <div id="page" class="page"></div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal"></div>
</div>

<script src="app.js"></script>
</body>
</html>
